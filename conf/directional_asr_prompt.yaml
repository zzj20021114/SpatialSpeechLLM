# 定向 ASR 提示模板（标签式，风格对齐 OSUM/conf/prompt_config.yaml）
#
# 标签组合 -> 模板列表。训练时从列表中随机采样一条。
# 首期任务：左右定向识别。所有模板要求输出严格可解析：
#   <转录内容> <方位> 左     或     <转录内容> <方位> 右

<TRANSCRIBE> <DIRECTION>:
  - 请转录音频中的语音内容，并在转录文本之后给出<方位>标签标明说话人方位。方位只有两种：左、右。格式固定为：<转录内容> <方位> 左，或 <转录内容> <方位> 右。
  - 将音频中的语音转录为文字，并在转录末尾用<方位>标签说明说话人在左侧还是右侧。输出格式：<转录内容> <方位> 左，或 <转录内容> <方位> 右。
  - 转录这段音频的语音内容，然后判断说话人位于左侧还是右侧，以<方位>标签给出，格式：<转录内容> <方位> 左，或 <转录内容> <方位> 右。
  - 请执行语音识别任务，将音频转为文字，并在结尾处附上<方位>标签标明声源方向。方位只有左、右两种，输出：<转录内容> <方位> 左，或 <转录内容> <方位> 右。
  - 将音频内容转录成文字，并在文本末尾附加<方位>标签给出说话人方位。只需区分左右：<转录内容> <方位> 左，或 <转录内容> <方位> 右。

<DIRECTION>:
  - 请识别音频中说话人的方位，用<方位>标签输出左或右。格式：<方位> 左，或 <方位> 右。
  - 请判断音频中说话人位于左侧还是右侧，输出：<方位> 左，或 <方位> 右。
  - 请给出音频中声源的方向（仅左、右两类），格式固定为：<方位> 左，或 <方位> 右。
